name: globalscore_app
description: "GlobalScore - Plataforma gamificada de predicciones deportivas."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  go_router: ^17.2.3
  flutter_riverpod: ^3.3.1
  supabase_flutter: ^2.12.4
  google_fonts: ^8.1.0
  cached_network_image: ^3.3.1
  image_picker: ^1.1.2
  http: ^1.2.1
  intl: ^0.19.0
  pointycastle: ^3.9.1
  flutter_launcher_icons: ^0.14.3
  flutter_native_splash: ^2.4.3
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_native_splash:
  color: "#1a1a2e"
  image: assets/splash_logo.png
  android_12:
    color: "#1a1a2e"
    image: assets/splash_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/app_icon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/splash_logo.png
    - assets/app_icon.png